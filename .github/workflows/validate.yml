name: Validate Santa Clara

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Check static demo assets
        run: |
          test -f public/santa-clara-v2.html
          test -f public/site-v2/hero-vogue.b64
          test -f public/site-v2/transitions-santa.b64
          test -f public/site-v2/santa-pink.b64
          test -f public/site-v2/artioli-black.b64
          test -f public/site-v2/carolina-blue.b64
          test -f public/site-v2/carolina-black-detail.b64
          test -f public/site-v2/carolina-black-case.b64
          test -f public/site-v2/carolina-red.b64
          grep -q '<span />' app/page.tsx
          grep -q 'santa-pink.b64' app/page.tsx
          grep -q 'carolina-red.b64' app/page.tsx

      - name: Build
        run: npm run build
