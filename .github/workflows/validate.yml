name: Validate Santa Clara

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check storefront only
        run: >-
          npx tsc --noEmit --jsx react-jsx --esModuleInterop
          --allowSyntheticDefaultImports --module esnext --moduleResolution bundler
          --target es2022 --lib dom,dom.iterable,es2022 --skipLibCheck
          app/page.tsx app/layout.tsx

      - name: Validate Santa Clara assets and mobile navigation
        run: |
          test -f public/santa-clara-v2.html
          test -f public/site-v2/hero-vogue.b64
          test -f public/site-v2/transitions-santa.b64
          test -f public/site-v2/santa-pink.b64
          test -f public/site-v2/artioli-black.b64
          test -f public/site-v2/carolina-blue.b64
          test -f public/site-v2/carolina-black-detail.b64
          test -f public/site-v2/carolina-black-case.b64
          test -f public/site-v2/carolina-red.b64
          grep -q 'menu-toggle' app/page.tsx
          test "$(grep -o '<span />' app/page.tsx | wc -l)" -ge 3
          grep -q 'santa-pink.b64' app/page.tsx
          grep -q 'carolina-red.b64' app/page.tsx
          grep -q 'optica-santa-clara-demo.vercel.app' app/layout.tsx
